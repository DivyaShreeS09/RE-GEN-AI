name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (isolated SQLite and PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        ports: ["127.0.0.1:5433:5432"]
        env:
          POSTGRES_DB: regen_test
          POSTGRES_HOST_AUTH_METHOD: trust
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run tests
        run: pytest backend/tests/ -v
        env:
          RATELIMIT_ENABLED: "false"

      - name: PostgreSQL regression in a temporary schema
        run: python -m pytest backend/tests/ -q
        env:
          REGEN_TEST_POSTGRES: "1"
          REGEN_TEST_POSTGRES_DSN: postgresql://postgres@127.0.0.1:5433/regen_test

  frontend:
    name: Frontend (oxlint + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: |
          node --version
          npm install --global npm@11.21.3
          npm --version
          npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Test
        working-directory: frontend
        run: npm run test
      - name: Build
        working-directory: frontend
        run: npm run build
